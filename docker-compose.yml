services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.6}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - opentelemetry-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.5.6}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - opentelemetry-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  apm-server:
    image: docker.elastic.co/apm/apm-server:${STACK_VERSION:-9.5.6}
    container_name: apm-server
    command:
      [
        "-e",
        "-E", "apm-server.host=0.0.0.0:8200",
        "-E", "output.elasticsearch.hosts=[\"elasticsearch:9200\"]",
      ]
    ports:
      - "8200:8200"
    networks:
      - opentelemetry-network
    depends_on:
      elasticsearch:
        condition: service_healthy

networks:
  opentelemetry-network:

volumes:
  elasticsearch-data:
